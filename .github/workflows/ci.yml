name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default: the job only reads the repository.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Pinned by commit SHA, same as release.yml; Dependabot keeps them
      # current (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies (Wails/GUI — cgo, GTK4/WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Check gofmt
        run: gofmt -l . | (! grep .)

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run

      - name: Run tests
        run: go test -race ./...

      # The runner's preinstalled Node — the suite needs nothing else.
      - name: Frontend smoke test
        run: |
          node --version
          make test-frontend
