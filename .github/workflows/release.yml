name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing by default: each job asks only for what it needs. The job that runs
# third-party tooling (apt, go install, lint, tests, build) never holds a
# token that can write to the repository or its releases.
permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Actions are pinned by commit SHA (tags are mutable); Dependabot keeps
      # them current (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main — refusing to publish."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies (Wails/GUI — cgo, GTK4/WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Check gofmt
        run: gofmt -l . | (! grep .)

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run

      - name: Run tests
        run: go test -race ./...

      - name: Frontend smoke test
        run: make test-frontend

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/prci-linux-amd64
            dist/perci-menu.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # Sigstore certificate for the attestation
      attestations: write # store the attestation

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/prci-linux-amd64
            dist/perci-menu.tar.gz
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: perci.gnl ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/prci-linux-amd64
            dist/perci-menu.tar.gz
            dist/checksums.txt
          body: |
            ## perci.gnl ${{ github.ref_name }}

            Só linux/amd64 nesta release — o Perci agora é uma aplicação
            gráfica (Wails v3), que usa cgo (GTK4/WebKitGTK 6.0) e não faz
            cross-compile pra arm64 sem um toolchain dedicado; suporte a
            arm64 fica pendente.

            ### Instalação rápida

            ```bash
            curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/oito2/perci/${{ github.ref_name }}/install.sh | bash
            ```

            ### Instalação manual

            Baixe `prci-linux-amd64` e `checksums.txt`, confira o checksum e instale:

            ```bash
            sha256sum --ignore-missing -c checksums.txt
            sudo install -m 755 -o root -g root prci-linux-amd64 /usr/local/bin/prci
            ```

            ### Verificar a procedência

            Os arquivos desta release têm attestation de build (SLSA), gerada por este workflow:

            ```bash
            gh attestation verify prci-linux-amd64 --repo oito2/perci
            ```

            ### Compilar do código-fonte

            Requer as dependências de sistema do Wails/GTK4/WebKitGTK 6.0:

            ```bash
            sudo apt install -y libgtk-4-dev libwebkitgtk-6.0-dev
            ```

            ```bash
            git clone https://github.com/oito2/perci.git
            cd perci
            git checkout ${{ github.ref_name }}
            make install VERSION=${{ github.ref_name }}
            ```

            ---

            Veja o [CHANGELOG.md](https://github.com/oito2/perci/blob/main/CHANGELOG.md) para a lista completa de mudanças.
