version: "2"

# Only errcheck is tuned here; the default "standard" linter group
# (errcheck, govet, staticcheck, unused) is used as is, with no explicit
# `enable:` list.
linters:
  settings:
    errcheck:
      # fmt.Fprint/Fprintf/Fprintln failures against a terminal writer are
      # not actionable (there's nothing sensible to do about a failed
      # print), so they're excluded to keep errcheck focused on
      # cleanup/Close calls, where a swallowed error is a real resource
      # leak.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
