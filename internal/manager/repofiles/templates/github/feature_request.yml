name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search the existing issues first: it may already be proposed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who has it, and when?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, screenshots or links.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this feature has not been requested.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
